<!DOCTYPE html>
{% load static %}
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}" />
    <link rel="alternate icon" href="{% static 'images/favicon.ico' %}" />
    <title>Create account</title>
    <script src="{% static 'js/dist/theme-init.min.js' %}"></script>
    <script type="module" src="{% static 'js/dist/components.min.js' %}"></script>
    <script type="module" src="{% static 'js/dist/auth.min.js' %}"></script>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="{% static 'css/dist/styles.min.css' %}" />
  </head>
  <body class="rp-fp-page" data-screen-label="Register">
    <div class="rp-auth-bar">
      <div class="rp-logo" id="rp-app-logo" data-app-logo>RP</div>
      <div>
        <div class="rp-auth-bar-name" id="rp-app-name">Resource Planner</div>
        <div class="rp-subtle rp-auth-bar-sub" id="rp-app-sub"></div>
      </div>
      <div class="ms-auto d-flex align-items-center gap-2">
        <theme-toggle></theme-toggle>
        <link-field href="/login/" id="rp-register-sign-in-link">
        <icon-field icon="bi-arrow-left"></icon-field> Sign in
      </link-field>
    </div>
  </div>
  <div class="rp-fp-body">
    <div class="rp-fp-card">
      <div class="rp-card" id="rp-register-card">
        <div class="rp-card-body">
          <div class="rp-fp-step-icon rp-fp-step-icon--accent">
            <icon-field icon="bi-person-plus"></icon-field>
          </div>
          <h1 class="rp-h2 mb-1">Create an account</h1>
          <p class="rp-muted mb-4">Fill in your details to get started.</p>
          <flash-banner id="rp-register-success" type="success" title="Account created!" subtitle="" class="mb-3"></flash-banner>
          <flash-banner id="rp-register-error" type="error" title="Registration failed" subtitle="" class="mb-3"></flash-banner>
          <form id="rp-register-form" class="rp-stack-16" novalidate>
            {% csrf_token %}
            <div class="row g-3">
              <first-name-field id="rp-register-first-name" name="first_name" col="col-md-6" required autocomplete="given-name"></first-name-field>
              <last-name-field id="rp-register-last-name" name="last_name" col="col-md-6" required autocomplete="family-name"></last-name-field>
              <email-field id="rp-register-email" name="email" col="col-12" required prefix-icon autocomplete="email"></email-field>
              <password-field id="rp-register-password" name="password" label="Password" col="col-12" required prefix-icon eye-icon strength autocomplete="new-password"></password-field>
              <confirm-password-field id="rp-register-confirm-password" name="confirm_password" label="Confirm password" col="col-12" required prefix-icon eye-icon password-field-id="rp-register-password" autocomplete="new-password"></confirm-password-field>
            </div>
            <primary-button id="rp-register-btn" label="Create account" prefix-icon="bi-person-check" type="submit" class="rp-auth-submit mt-2"></primary-button>
          </form>
        </div>
      </div>
    </div>
  </div>
  <cookie-banner id="rp-cookie-banner" title="Cookie preferences" body="We use session cookies for authentication and localStorage to remember your theme. No third-party tracking." accept-label="Accept" reject-label="Decline" more-info-label="Privacy Notice" more-info-href="#"></cookie-banner>
</body>
</html>
