<!doctype html>
{% load static %}
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Create account</title>

    <script src="{% static 'js/dist/theme-init.min.js' %}"></script>
    <script type="module" src="{% static 'js/dist/components.min.js' %}"></script>
    <script type="module" src="{% static 'js/dist/auth.min.js' %}"></script>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="{% static 'css/dist/styles.min.css' %}" />
  </head>

  <body class="rp-fp-page" data-screen-label="Register">
    <div class="rp-auth-bar">
      <div class="rp-logo" id="rp-app-logo" data-app-logo>RP</div>
      <div>
        <div class="rp-auth-bar-name" id="rp-app-name">Resource Planner</div>
        <div class="rp-subtle rp-auth-bar-sub" id="rp-app-sub"></div>
      </div>
      <div class="ms-auto d-flex align-items-center gap-2">
        <rp-theme-toggle></rp-theme-toggle>
        <a class="rp-link" id="rp-register-sign-in-link" href="/login/"><i class="bi bi-arrow-left"></i> Sign in</a>
      </div>
    </div>

    <div class="rp-fp-body">
      <div class="rp-fp-card">
        <div class="rp-card" id="rp-register-card">
          <div class="rp-card-body">
            <div class="rp-fp-step-icon rp-fp-step-icon--accent">
              <i class="bi bi-person-plus"></i>
            </div>
            <h1 class="rp-h2 mb-1">Create an account</h1>
            <p class="rp-muted mb-4">Fill in your details to get started.</p>

            <rp-flash-banner
              id="rp-register-error"
              type="error"
              title="Registration failed"
              subtitle=""
              class="mb-3"
            ></rp-flash-banner>

            <form id="rp-register-form" class="rp-stack-16" novalidate>
              {% csrf_token %}
              <div class="row g-3">
                <rp-field-first-name
                  id="rp-register-first-name"
                  name="first_name"
                  col="col-md-6"
                  required
                  autocomplete="given-name"
                ></rp-field-first-name>
                <rp-field-last-name
                  id="rp-register-last-name"
                  name="last_name"
                  col="col-md-6"
                  required
                  autocomplete="family-name"
                ></rp-field-last-name>
                <rp-field-email
                  id="rp-register-email"
                  name="email"
                  col="col-12"
                  required
                  prefix-icon
                  autocomplete="email"
                ></rp-field-email>
                <rp-field-password
                  id="rp-register-password"
                  name="password"
                  label="Password"
                  col="col-12"
                  required
                  prefix-icon
                  eye-icon
                  strength
                  autocomplete="new-password"
                ></rp-field-password>
                <rp-field-confirm-password
                  id="rp-register-confirm-password"
                  name="confirm_password"
                  label="Confirm password"
                  col="col-12"
                  required
                  prefix-icon
                  eye-icon
                  password-field-id="rp-register-password"
                  autocomplete="new-password"
                ></rp-field-confirm-password>
              </div>
              <rp-button-primary
                id="rp-register-btn"
                label="Create account"
                prefix-icon="bi-person-check"
                type="submit"
                class="rp-auth-submit mt-2"
              ></rp-button-primary>
            </form>
          </div>
        </div>
      </div>
    </div>

    <rp-cookie
      id="rp-cookie-banner"
      title="Cookie preferences"
      body="We use session cookies for authentication and localStorage to remember your theme. No third-party tracking."
      accept-label="Accept"
      reject-label="Decline"
      more-info-label="Privacy Notice"
      more-info-href="#"
    ></rp-cookie>
  </body>
</html>
