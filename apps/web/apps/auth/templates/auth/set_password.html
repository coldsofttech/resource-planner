<!DOCTYPE html>
{% load static %}
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}" />
    <link rel="alternate icon" href="{% static 'images/favicon.ico' %}" />
    <title>Set password</title>
    <script src="{% static 'js/dist/theme-init.min.js' %}"></script>
    <script type="module" src="{% static 'js/dist/components.min.js' %}"></script>
    <script type="module" src="{% static 'js/dist/auth.min.js' %}"></script>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous" />
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="{% static 'css/dist/styles.min.css' %}" />
  </head>
  <body class="rp-fp-page" data-screen-label="SetPassword">
    <div class="rp-auth-bar">
      <div class="rp-logo" id="rp-app-logo" data-app-logo>RP</div>
      <div>
        <div class="rp-auth-bar-name" id="rp-app-name">Resource Planner</div>
        <div class="rp-subtle rp-auth-bar-sub" id="rp-app-sub"></div>
      </div>
      <div class="ms-auto d-flex align-items-center gap-2">
        <theme-toggle></theme-toggle>
        <link-field href="/login/" id="rp-set-password-sign-in-link">
          <icon-field icon="bi-arrow-left"></icon-field> Sign in
        </link-field>
      </div>
    </div>
    <div class="rp-fp-body">
      <div class="rp-fp-card">
        <div class="rp-card" id="rp-set-password-card">
          <div class="rp-card-body">
            <div class="rp-fp-step-icon rp-fp-step-icon--accent">
              <icon-field icon="bi-key"></icon-field>
            </div>
            <h1 class="rp-h2 mb-1">Set your password</h1>
            <p class="rp-muted mb-4">Choose a strong password for your account.</p>
            <flash-banner id="rp-set-password-success" type="success" title="Password set!" subtitle="Redirecting to sign in..." class="mb-3"></flash-banner>
            <flash-banner id="rp-set-password-error" type="error" title="Failed to set password" subtitle="" class="mb-3"></flash-banner>
            <form id="rp-set-password-form" class="rp-stack-16" novalidate>
              {% csrf_token %}
              <input type="hidden" id="rp-set-password-token" name="token" value="" />
              <div class="row g-3">
                <password-field id="rp-set-password-new" name="new_password" label="New password" col="col-12" required prefix-icon eye-icon strength dynamic-policy min-length="{{ pwd_min_length }}" {% if pwd_require_uppercase %}require-uppercase{% endif %} {% if pwd_require_lowercase %}require-lowercase{% endif %} {% if pwd_require_digits %}require-digit{% endif %} {% if pwd_require_special %}require-special{% endif %} autocomplete="new-password"></password-field>
                <confirm-password-field id="rp-set-password-confirm" name="confirm_password" label="Confirm password" col="col-12" required prefix-icon eye-icon password-field-id="rp-set-password-new" autocomplete="new-password"></confirm-password-field>
              </div>
              <primary-button id="rp-set-password-btn" label="Set password" prefix-icon="bi-check2-circle" type="submit" class="rp-auth-submit mt-2"></primary-button>
            </form>
          </div>
        </div>
      </div>
    </div>
    <cookie-banner id="rp-cookie-banner" title="Cookie preferences" body="We use session cookies for authentication and localStorage to remember your theme. No third-party tracking." accept-label="Accept" reject-label="Decline" more-info-label="Privacy Notice" more-info-href="#"></cookie-banner>
  </body>
</html>
