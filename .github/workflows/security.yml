name: Security Checks

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install bandit pip-audit

      - name: Bandit
        run: bandit -r apps packages

      - name: pip-audit
        run: pip-audit
