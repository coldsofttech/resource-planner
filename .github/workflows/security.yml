name: Security Checks

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit bandit-sarif-formatter pip-audit

      - name: Bandit
        run: |
          bandit -r apps packages --configfile pyproject.toml -f sarif -o bandit.sarif || true
          [ -f bandit.sarif ] || printf '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"Bandit","rules":[]}},"results":[]}]}' > bandit.sarif

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit

      - name: pip-audit
        run: pip-audit
