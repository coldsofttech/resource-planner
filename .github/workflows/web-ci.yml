name: Web CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".github/workflows/web-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          pip install -r apps/web/requirements/base.txt
          pip install -r apps/web/requirements/dev.txt
          pip install ruff mypy pytest bandit pip-audit

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets (CSS + JS)
        run: |
          npm run build:css
          npm run build:js

      - name: Verify frontend build outputs
        run: |
          test -f apps/web/static/css/dist/styles.min.css
          test -f apps/web/static/js/dist/main.min.js
          test -f apps/web/static/js/dist/utils.min.js
          test -f apps/web/static/js/dist/components.min.js
          test -f apps/web/static/js/dist/setup.min.js

      - name: Ruff
        run: ruff check .

      - name: Ruff Format
        run: ruff format --check .

      - name: mypy
        run: mypy apps/web

      - name: pytest
        run: pytest

      - name: Bandit
        run: bandit -r apps/web packages

      - name: pip-audit
        run: pip-audit

      - name: Django Security Checks
        run: |
          cd apps/web
          python manage.py check --deploy
