name: Jobs CI

on:
  pull_request:
    paths:
      - "apps/jobs/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff bandit pip-audit

      - name: Ruff
        run: ruff check apps/jobs

      - name: pytest
        run: pytest apps/jobs

      - name: Bandit
        run: bandit -r apps/jobs

      - name: pip-audit
        run: pip-audit
