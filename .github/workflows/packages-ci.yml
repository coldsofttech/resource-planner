name: Packages CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/actions/gitleaks

  lint:
    name: Lint (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: &packages
          - aicore
          - awscore
          - emailcore
          - exportcore
          - otpcore
          - pycore
          - storagecore

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-python

      - uses: ./.github/actions/install-python-deps

      - uses: ./.github/actions/install-packages
        with:
          package: ${{ matrix.package }}

      - uses: ./.github/actions/ruff
        with:
          path: packages/${{ matrix.package }}

      - uses: ./.github/actions/mypy
        with:
          path: packages/${{ matrix.package }}

      - uses: ./.github/actions/bandit
        with:
          path: packages/${{ matrix.package }}

      - uses: ./.github/actions/pip-audit

  unit-tests:
    name: Unit Tests (${{ matrix.package }})
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: *packages

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-python

      - uses: ./.github/actions/install-python-deps

      - uses: ./.github/actions/install-packages
        with:
          package: ${{ matrix.package }}

      - uses: ./.github/actions/unit-test
        with:
          path: packages/${{ matrix.package }}/tests/
          name: ${{ matrix.package }}
          extra-args: "-n auto --dist=loadfile -p no:django --import-mode=importlib"
          artifact-name: packages-unit-test-report-${{ matrix.package }}

  test:
    name: Integration Test (${{ matrix.package }})
    needs: [unit-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: *packages

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-python

      - uses: ./.github/actions/install-python-deps

      - uses: ./.github/actions/install-packages
        with:
          package: ${{ matrix.package }}

      - uses: ./.github/actions/integration-test
        with:
          path: packages/${{ matrix.package }}/tests/
          name: ${{ matrix.package }}
          extra-args: "-n auto --dist=loadfile -p no:django --import-mode=importlib"
          artifact-name: packages-test-report-${{ matrix.package }}

      - uses: ./.github/actions/build-validate
        with:
          package: ${{ matrix.package }}
