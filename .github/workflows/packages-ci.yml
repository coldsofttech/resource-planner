name: Packages CI

on:
  pull_request:
    paths:
      - "packages/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          pip install -r requirements/base.txt
          pip install -r requirements/dev.txt
          pip install build

      - name: Install packages
        run: |
          pip install -e packages/awscore
          pip install -e packages/pycore
          pip install -e packages/emailcore
          pip install -e packages/otpcore

      - name: Ruff
        run: ruff check packages

      - name: Ruff Format
        run: ruff format --check packages

      - name: mypy
        run: mypy packages

      - name: pytest
        run: |
          mkdir -p .pytest-reports
          pytest -n auto --dist=loadfile -p no:django --override-ini=addopts= --import-mode=importlib --junit-xml=.pytest-reports/junit.xml packages/awscore/tests/ packages/emailcore/tests/ packages/pycore/tests/ packages/otpcore/tests/

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packages-test-report
          path: .pytest-reports/

      - name: Build Validation
        run: |
          python -m build packages/awscore
          python -m build packages/pycore
          python -m build packages/emailcore
          python -m build packages/otpcore

      - name: Bandit
        run: bandit -r packages --configfile pyproject.toml

      - name: pip-audit
        run: pip-audit
